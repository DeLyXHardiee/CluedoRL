<!DOCTYPE html>
<html>
<head>
  <title>AI Cluedo</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="mode-selection" class="center-screen">
    <h1>AI Cluedo</h1>
    <div class="mode-options">
      <button class="mode-button" onclick="startGame('single')">Single Game</button>
      <button class="mode-button" onclick="startGame('play')">Play Against Bots</button>
      <button class="mode-button" onclick="startGame('multi')">Multiple Game</button>
      <input id="multi-count" type="number" min="1" value="5" style="width: 60px; margin-left: 8px;" />
    </div>
  </div>

  <div id="game-container" class="hidden">
    <div class="container">
      <div id="winner-overlay" class="hidden">
        <div class="winner-modal">
          <h2>🏆 Game Over!</h2>
          <div class="winner-content">
            <div class="winner-agent"></div>
            <div class="winner-solution"></div>
            <div class="game-stats"></div>
          </div>
        </div>
      </div>
      <div class="main-content">
        <button id="restart-game" class="hidden" type="button" onclick="restartGame()">
          Restart and Play Again
        </button>

        <div id="human-panel" class="memory-panel hidden">
          <h2>Your Investigation</h2>
          <div id="human-memory"></div>
          <div id="human-controls" class="hidden">
            <label>Suspect <select id="human-suspect"></select></label>
            <label>Weapon <select id="human-weapon"></select></label>
            <label>Room <select id="human-room"></select></label>
            <button type="button" onclick="submitHumanAction('suggestion')">Suggest</button>
            <button type="button" onclick="submitHumanAction('accusation')">Accuse</button>
          </div>
          <p id="human-turn-status"></p>
        </div>

        <div class="game-log">
          <h2>Investigation Log</h2>
          <div id="log-messages"></div>
        </div>
      </div>

      <div class="players-panel">
        <div class="players">
          <h2>Agents</h2>
          <div class="turn-info">
            <div id="current-turn">Turn <span class="current-number">0</span></div>
            <div class="solution-info">
              <div class="solution-label">Solution:</div>
              <div id="solution-display">Mrs. Peacock in the Dining Room with the Revolver</div>
            </div>
          </div>
          <div id="players-list"></div>
        </div>

        <div class="leaderboard-panel multi-game-only hidden">
          <h2>Leaderboard</h2>
          <table id="leaderboard">
            <thead>
              <tr>
                <th>Model</th>
                <th>Games</th>
                <th>Wins</th>
                <th>Win %</th>
                <th>Avg Turns</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>

        <div id="past-games" class="multi-game-only hidden">
          <h2>Past Games</h2>
          <div id="past-games-list"></div>
        </div>
      </div>
    </div>
  </div>

  <div id="shown-card-history"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const HUMAN_CARDS = {
      suspect: ['Miss Scarlet', 'Colonel Mustard', 'Mrs. White', 'Mr. Green', 'Mrs. Peacock', 'Professor Plum'],
      weapon: ['Candlestick', 'Dagger', 'Lead Pipe', 'Revolver', 'Rope', 'Wrench'],
      room: ['Kitchen', 'Ballroom', 'Conservatory', 'Dining Room', 'Billiard Room', 'Library', 'Lounge', 'Hall', 'Study']
    };

    function populateHumanControls() {
      [['human-suspect', HUMAN_CARDS.suspect], ['human-weapon', HUMAN_CARDS.weapon], ['human-room', HUMAN_CARDS.room]]
        .forEach(([id, cards]) => {
          document.getElementById(id).innerHTML = cards.map(card => `<option value="${card}">${card}</option>`).join('');
        });
    }

    function updateHumanControls(memory) {
      const eliminatedCards = new Set(memory?.knownInformation?.eliminatedCards || []);

      ['human-suspect', 'human-weapon', 'human-room'].forEach(id => {
        const select = document.getElementById(id);
        Array.from(select.options).forEach(option => {
          option.disabled = eliminatedCards.has(option.value);
        });

        if (select.selectedOptions[0]?.disabled) {
          const availableOption = Array.from(select.options).find(option => !option.disabled);
          if (availableOption) select.value = availableOption.value;
        }
      });
    }

    function submitHumanAction(type) {
      socket.emit('human-action', {
        type,
        suspect: document.getElementById('human-suspect').value,
        weapon: document.getElementById('human-weapon').value,
        room: document.getElementById('human-room').value
      });
    }

    function restartGame() {
      document.getElementById('log-messages').replaceChildren();
      document.getElementById('human-memory').replaceChildren();
      document.getElementById('human-turn-status').textContent = '';
      document.getElementById('restart-game').classList.add('hidden');
      populateHumanControls();
      socket.emit('game-mode', { mode: 'play' });
    }

    function renderHumanMemory(memory) {
      const container = document.getElementById('human-memory');
      const knownCardsByPlayer = memory?.knownInformation?.knownCardsByPlayer || {};
      const turnHistory = memory?.turnHistory || [];

      const playerRows = Object.entries(knownCardsByPlayer)
        .map(([playerName, cards]) => `
          <div class="memory-row">
            <span class="memory-label">${playerName}</span>
            <span class="memory-cards">${cards.length ? cards.join(', ') : 'No confirmed cards'}</span>
          </div>
        `)
        .join('');

      const turns = turnHistory.length
        ? turnHistory.map(turn => `<li>${turn}</li>`).join('')
        : '<li>No turns recorded yet.</li>';

      container.innerHTML = `
        <section class="memory-box">
          <h3>Confirmed Cards by Player</h3>
          <div class="memory-rows">${playerRows}</div>
        </section>
        <section class="memory-box">
          <h3>Turns</h3>
          <ol class="memory-turns">${turns}</ol>
        </section>
      `;
    }

    socket.on('error', ({ message }) => {
      document.getElementById('human-turn-status').textContent = message;
    });

    socket.on('game-over', ({ solution }) => {
      if (solution) {
        document.getElementById('solution-display').textContent =
          `${solution.suspect} in the ${solution.room} with the ${solution.weapon}`;
      }
      document.getElementById('human-controls').classList.add('hidden');
      document.getElementById('restart-game').classList.remove('hidden');
    });
    
    function startGame(mode) {
      document.getElementById('mode-selection').classList.add('hidden');
      document.getElementById('game-container').classList.remove('hidden');
      const data = { mode };
      if (mode === 'multi') {
        const input = document.getElementById('multi-count');
        const count = parseInt(input?.value, 10);
        if (!isNaN(count)) {
          data.count = count;
        }
      }
      socket.emit('game-mode', data);
    }

    socket.on('game-event', (event) => {
      const logElement = document.getElementById('log-messages');
      const timestamp = new Date(event.timestamp).toLocaleTimeString();
      
      let content = '';
      switch(event.type) {
        case 'SUGGESTION':
          content = `
            <div class="log-entry">
              <span class="timestamp">${timestamp}</span>
              <span class="agent">${event.agent}</span> suggests:
              <div class="suggestion-text">
                ${event.suggestion.suspect} in the ${event.suggestion.room} with the ${event.suggestion.weapon}
              </div>
              ${event.reasoning ? `<div class="reasoning">${event.reasoning}</div>` : ''}
            </div>
          `;
          break;
          
        case 'CHALLENGE':
          content = `
            <div class="log-entry">
              <span class="timestamp">${timestamp}</span>
              <span class="agent">${event.agent}</span> showed 
              <span class="shown-card">${event.cardShown}</span>
              to disprove the suggestion
            </div>
          `;
          break;
          
        case 'ACCUSATION':
          content = `
            <div class="log-entry">
              <span class="timestamp">${timestamp}</span>
              <span class="agent">${event.agent}</span>
              <span class="result ${event.result ? 'correct' : 'incorrect'}">
                ${event.message}
              </span>
            </div>
          `;
          break;
          
        default:
          content = `
            <div class="log-entry">
              <span class="timestamp">${timestamp}</span>
              ${event.message}
            </div>
          `;
      }
      
      logElement.insertAdjacentHTML('afterbegin', content);
    });

    
    socket.on('game-state', (state) => {
      
      const currentTurn = document.getElementById('current-turn');
      currentTurn.innerHTML = `Turn <span class="current-number">${state.currentTurn || 0}</span>`;
      
      
      if (state.solution) {
        const solutionDisplay = document.getElementById('solution-display');
        solutionDisplay.textContent = `${state.solution.suspect} in the ${state.solution.room} with the ${state.solution.weapon}`;
      } else {
        document.getElementById('solution-display').textContent = 'Hidden until the game ends';
      }

      const humanPanel = document.getElementById('human-panel');
      humanPanel.classList.toggle('hidden', !state.hasHumanPlayer);
      if (state.hasHumanPlayer) {
        renderHumanMemory(state.humanMemory);
        updateHumanControls(state.humanMemory);
        document.getElementById('human-controls').classList.toggle('hidden', !state.isHumanTurn);
        document.getElementById('human-turn-status').textContent = state.isHumanTurn
          ? 'Your turn: select one card from each category.'
          : `${state.activeAgent} is taking a turn.`;
      }
      
      
      const playersList = document.getElementById('players-list');
      playersList.innerHTML = state.agents.map(agent => `
        <div class="player ${agent.isAlive ? 'active' : 'eliminated'} ${agent.name === state.activeAgent ? 'current-turn' : ''}">
          <div class="player-header">
            <span class="agent-name">${agent.name}</span>
            <span class="status-icon">${agent.isAlive ? '👾 Active' : '💀 Eliminated'}</span>
          </div>
          ${agent.cards ? `
            <div class="agent-cards">
              ${agent.cards.map(card => `<span class="card">${card}</span>`).join(' ')}
            </div>
          ` : ''}
        </div>
      `).join('');

    });

    populateHumanControls();

    
    socket.on('game-solution', (solution) => {
      const solutionDisplay = document.getElementById('solution-display');
      solutionDisplay.textContent = `${solution.suspect} in the ${solution.room} with the ${solution.weapon}`;
    });

  </script>

  <style>
    /* Updated layout styles */
    .container {
      display: flex;
      gap: 30px;
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }

    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 30px;
      max-width: 800px;
    }

    .players-panel {
      width: 300px;
      flex-shrink: 0;
    }

    /* Game board styles */
    .game-board {
      background: #2a2a2a;
      border-radius: 8px;
      padding: 20px;
    }

    .rooms {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
    }

    .room {
      position: relative;
      background: #333;
      padding: 15px;
      border-radius: 6px;
      text-align: center;
      transition: all 0.2s ease;
    }

    .room-indicator {
      position: absolute;
      top: -6px;
      right: -6px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: transparent;
      display: none;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
      font-size: 12px;
      box-shadow: 0 0 0 2px #1a1a1a;
    }

    .room.suggested {
      background: #2d3748;
    }

    .room.recent-suggestion {
      background: #2d3748;
      box-shadow: 0 0 0 2px #4a9eff;
    }

    .room.recent-suggestion .room-indicator {
      display: flex;
      background: #4a9eff;
    }

    /* Investigation log styles */
    .game-log {
      background: #2a2a2a;
      border-radius: 8px;
      padding: 20px;
      height: 400px;
      overflow-y: auto;
    }

    #log-messages {
      display: flex;
      flex-direction: column-reverse;
      gap: 12px;
    }

    .log-entry {
      padding: 12px 15px;
      color: #ddd;
      line-height: 1.5;
    }

    .suggestion-text {
      margin-top: 8px;
      margin-left: 12px;
      color: #ddd;
    }

    .reasoning {
      margin-top: 8px;
      margin-left: 12px;
      color: #888;
      font-style: italic;
    }

    /* Players panel styles */
    .players {
      background: #2a2a2a;
      border-radius: 8px;
      padding: 20px;
      position: sticky;
      top: 20px;
    }

    .player {
      background: #333;
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 8px;
      border-left: 3px solid transparent;
      transition: all 0.2s ease;
    }

    .player.current-turn {
      background: #2d3748;
      border-left-color: #4a9eff;
      box-shadow: 0 0 0 1px rgba(74, 158, 255, 0.2);
    }

    .player-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .agent-name {
      font-weight: 500;
    }

    .status-icon {
      font-size: 0.9em;
      opacity: 0.8;
    }

    .agent-cards {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 8px;
    }

    .card {
      background: #222;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.9em;
      color: #ddd;
    }

    .player.eliminated {
      opacity: 0.6;
    }

    .player.eliminated .card {
      background: #1a1a1a;
    }

    /* Turn info styles */
    .turn-info {
      background: #333;
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 16px;
    }

    #current-turn {
      font-size: 1.1em;
      margin-bottom: 8px;
    }

    .current-number {
      color: #4a9eff;
      font-weight: 600;
    }

    .solution-info {
      font-size: 0.9em;
      color: #888;
    }

    .solution-label {
      margin-bottom: 4px;
    }

    #solution-display {
      color: #4a9eff;
      font-weight: 500;
      line-height: 1.4;
    }

    /* Remove grid background */
    body {
      background: #1a1a1a;
      margin: 0;
      padding: 20px;
      font-family: system-ui, -apple-system, sans-serif;
    }

    h2 {
      color: #4a9eff;
      margin-top: 0;
      margin-bottom: 16px;
      font-size: 1.2em;
    }

    .shown-card {
      color: #4a9eff;
      font-weight: 500;
      background: rgba(74, 158, 255, 0.1);
      padding: 2px 6px;
      border-radius: 4px;
    }

    /* Current turn styles */
    .current-agent {
      color: #4a9eff;
      font-weight: 600;
    }

    #human-memory {
      display: grid;
      gap: 12px;
      margin-bottom: 12px;
    }

    #human-panel {
      padding: 24px;
      height: auto;
      min-height: 520px;
      overflow: visible;
    }

    #human-panel h2 {
      font-size: 1.45em;
      margin-bottom: 20px;
    }

    #restart-game {
      align-self: flex-start;
      padding: 10px 16px;
      border: 0;
      border-radius: 6px;
      background: #4a9eff;
      color: #fff;
      font-weight: 600;
      cursor: pointer;
    }

    .memory-box {
      background: #262626;
      border: 1px solid #3d3d3d;
      border-radius: 6px;
      overflow: hidden;
    }

    .memory-box h3 {
      margin: 0;
      padding: 8px 10px;
      font-size: 0.9em;
      color: #4a9eff;
      background: #303030;
    }

    .memory-row {
      display: grid;
      grid-template-columns: minmax(110px, 0.8fr) minmax(0, 2fr);
      gap: 10px;
      padding: 8px 10px;
      border-top: 1px solid #3d3d3d;
      font-size: 0.85em;
    }

    .memory-label {
      font-weight: 600;
      color: #e0e0e0;
    }

    .memory-cards {
      color: #b8b8b8;
    }

    .memory-turns {
      max-height: 320px;
      overflow-y: auto;
      margin: 0;
      padding: 8px 10px 8px 30px;
      color: #c8c8c8;
      font-size: 0.85em;
    }

    .memory-turns li + li {
      margin-top: 6px;
    }

    #human-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: end;
    }

    #human-controls label {
      display: grid;
      gap: 4px;
      font-size: 0.85em;
    }

    #human-controls select,
    #human-controls button {
      min-height: 34px;
    }
  </style>
</body>
</html>
